              <div class="modal fade" id="addContactModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                  <div class="modal-content">
                    <!-- Modal Header -->

                        <div class="align-items-start mt-4 w-100">

                        </div>
                        <!-- phone -->
                        <div class="align-items-start mt-4 w-100">
                          <label for="phoneInput" class="mb-2">Phone Number <span class="required-star">*</span></label>
                          <input type="number" class="form-control p-2 rounded-2" id="phoneInput" placeholder="e.g.,01012345678" />
                        </div>
                        <!-- email -->
                        <div class="align-items-start mt-4 w-100">
                          <label for="emailInput" class="mb-2">Email Address</label>
                          <input type="email" class="form-control p-2 rounded-2" id="emailInput" placeholder="name@emample.com" />
                        </div>
                        <!-- address -->
                        <div class="align-items-start mt-4 w-100">
                          <label for="addressInput" class="mb-2">Address</label>
                          <input type="text" class="form-control p-2 rounded-2" id="addressInput" placeholder="Enter adress" />
                        </div>

                          <select type="text" class="form-control p-2 rounded-2" id="groupInput" placeholder="Select Group">
                            <option value="Family">Select a group</option>
                            <option value="Family">Family</option>
                            <option value="Friend">Friend</option>
                            <option value="Work">Work</option>
                            <option value="School">School</option>
                            <option value="Other">Other</option>
                          </select>
                        </div>
                        <!-- note -->
                        <div class="align-items-start mt-4 w-100">
                          <label for="noteInput" class="mb-2">Notes</label>
                          <input type="text" class="form-control p-4 rounded-2" id="noteInput" placeholder="Add notes about this contact" />
